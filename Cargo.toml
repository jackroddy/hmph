[package]
name = "hmph"
version = "0.1.0"
edition = "2024"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/jackroddy/hmph"
license = "MIT OR Apache-2.0"
description = "how much parallelization happens: a timeline of a process tree's concurrency"
readme = "README.md"
exclude = ["CLAUDE.md"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toil = "0.3"
libc = "0.2"
